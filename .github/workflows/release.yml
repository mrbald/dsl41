# Release a tagged candidate to PyPI via trusted publishing (OIDC, no stored
# tokens). One-time setup on pypi.org: Account -> Publishing -> add pending
# publisher (project dsl41, owner mrbald, repo dsl41, workflow release.yml,
# environment pypi). The `pypi` environment requires the owner's approval and
# deploys only from `v*` tags, so `publish` waits in the run's page for that
# approval. Release: README "Make a release".
#
# DL-215: nothing is published that did not pass the whole CI gate list
# (`gates` calls ci.yml) and the installed-artifact smoke test (`smoke` runs
# scripts/release_smoke.sh on the very files `publish` uploads). `build`
# exports the closure from uv.lock with `--frozen` and ships it beside the
# wheel as requirements-base.txt and requirements-ui.txt.
#
# The release jobs keep no git credentials and use no uv cache, so nothing a
# cache or an earlier step left behind reaches the candidate.
#
# Publication needs a tag: a tag push, or a manual run (workflow_dispatch) from
# a tag with `publish` set. `release-assets` follows every publish. A manual
# run from any other ref, or without `publish`, is a rehearsal: it runs
# `gates`, `build` and `smoke` and publishes nothing.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI and create the GitHub release (tag refs only; tag pushes always publish)"
        type: boolean
        default: false

permissions: {}

jobs:
  gates:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false
      # The tag and pyproject.toml must name one version, and the tag must be
      # annotated: its message is the release note. The explicit fetch keeps
      # the tag object, whatever the checkout did with it.
      - name: tag names the pyproject version and is annotated
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match pyproject.toml version $version"
            exit 1
          fi
          git fetch --no-tags --force origin "+refs/tags/$TAG:refs/tags/$TAG"
          kind="$(git cat-file -t "refs/tags/$TAG")"
          if [ "$kind" != tag ]; then
            echo "::error::tag $TAG is lightweight ($kind); release tags are annotated"
            exit 1
          fi
          echo "tag $TAG is annotated and matches version $version"
      # sdist and wheel are built separately from the tree, so the wheel is
      # not built from the sdist; smoke then rebuilds a wheel from the sdist
      # and compares the two, which catches a file the sdist lost
      - run: uv build --sdist
      - run: uv build --wheel
      # twine is pinned: a check that moves with the tool is not a gate.
      - run: uvx twine==7.0.0 check --strict dist/*
      - name: export the locked closure (hashes included)
        run: |
          set -euo pipefail
          mkdir exports
          uv export --frozen --no-dev --no-emit-project -o exports/requirements-base.txt
          uv export --frozen --no-dev --no-emit-project --extra ui -o exports/requirements-ui.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate
          path: |
            dist/
            exports/
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # the checkout supplies the script and its example inputs; the code
      # under test comes from the candidate only
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false
      # the floor of requires-python
      - run: uv python install 3.12
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate
          path: candidate
      - name: installed-artifact smoke
        run: |
          set -euo pipefail
          PYTHON="$(uv python find --managed-python 3.12)"
          export PYTHON
          bash scripts/release_smoke.sh candidate/dist candidate/exports

  publish:
    needs: [gates, build, smoke]
    if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/dsl41
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate
          path: candidate
      # the smoked files, nothing rebuilt; exports/ stays off PyPI
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: candidate/dist/

  release-assets:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      # --notes-from-tag reads the annotation from the local repository
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git fetch --no-tags --force origin "+refs/tags/$TAG:refs/tags/$TAG"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate
          path: candidate
      - name: assets and SHA256SUMS
        run: |
          set -euo pipefail
          mkdir assets
          cp candidate/dist/* candidate/exports/* assets/
          cd assets
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS .
          cat SHA256SUMS
      - name: create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --verify-tag --notes-from-tag assets/*
