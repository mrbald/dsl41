# The project's quality gates on every push/PR: pytest (the CLAUDE.md suite,
# bisimulation gate included), ruff check, ruff format --check (the whole tree
# adopted formatter output at the 1.0.0 boundary), mypy, and the DL-75
# architecture gate (scripts/arch_check.py), on every leg; a separate
# `coverage` job (DL-211) runs the same gates plus the branch-coverage report
# on 3.14, which is therefore the suite's only 3.14 leg;
# a third job runs the emitted explore page in three browser engines (DL-77).
# README's "tests" brick badges this workflow.
#
# The python matrix is deliberate, not ceremony: the v0.2.0 release hang was a
# 3.12-only asyncio Server.wait_closed() behavior that 3.14 dev boxes never see.
# timeout-minutes converts any future hang into a fast red X instead of a 6h burn.
#
# DL-215: release.yml calls this workflow as its `gates` job, so a release
# passes the same list, and `uv sync --locked` fails when uv.lock no longer
# matches pyproject.toml instead of re-resolving.
#
# `classify` decides whether a change can affect anything but documentation:
# a change whose every path is README.md, CLAUDE.md, docs/**/*.md,
# examples/**/*.md or .claude/skills/**/*.md (DL-434) is
# docs-only, and the suite jobs skip; `docs` runs the docs gate of
# scripts/prepush_checks.py on every change. A pull request compares with
# its base branch, a branch push with the commit it replaced; a tag push, a
# manual run and a call from release.yml always count as code. A classify
# failure leaves its output empty, which also counts as code. A change to
# scripts/prepush_checks.py or anything under .github/ counts as code without
# asking the script, so a pull request never classifies itself with its own
# classifier.

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
      base: ${{ steps.classify.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A called workflow sees its caller's event, so a release run arrives
      # as a tag push or a manual run, and both fall to the always-code case.
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -uo pipefail
          base=""
          if [ "$EVENT" = pull_request ]; then
            base="origin/$BASE_REF"
          elif [ "$EVENT" = push ] && [ "$REF_TYPE" = branch ] \
              && [ -n "$BEFORE" ] && [ -n "${BEFORE//0/}" ] \
              && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          fi
          code="code=true"
          if [ -n "$base" ]; then
            changed=$(git diff --name-only --no-renames "$base...HEAD")
            echo "$changed"
            if ! grep -Eq '^(scripts/prepush_checks\.py|\.github/)' <<< "$changed"; then
              code=$(python3 scripts/prepush_checks.py --classify --base "$base") || code="code=true"
            fi
          else
            base="HEAD~1"
          fi
          echo "$code base=$base"
          { echo "$code"; echo "base=$base"; } >> "$GITHUB_OUTPUT"

  # The docs gate on every change: the doc tests, the tests that name a
  # changed Markdown file, and the DL-75 architecture gate.
  docs:
    needs: classify
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra dev
      - env:
          BASE: ${{ needs.classify.outputs.base || 'HEAD~1' }}
        run: uv run python scripts/prepush_checks.py --docs --base "$BASE"

  # A job-level `if` is evaluated before the matrix expands, so a skipped
  # matrix job reports one check named `test`, and the required
  # "test (3.12)" and "test (3.13)" checks never arrive. The legs therefore
  # always start, and each step carries the classify condition.
  test:
    needs: classify
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - if: needs.classify.outputs.code != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: needs.classify.outputs.code != 'false'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - if: needs.classify.outputs.code != 'false'
        run: uv sync --locked --extra dev
      - if: needs.classify.outputs.code != 'false'
        run: uv run ruff check src tests examples
      - if: needs.classify.outputs.code != 'false'
        run: uv run ruff format --check src tests scripts examples
      - if: needs.classify.outputs.code != 'false'
        run: uv run mypy
      # DL-75: blocking checks only decide the exit code (duplicate bodies,
      # new private cross-module imports in src/, unresolvable citations, an
      # IR-F shape change without an IR_VERSION bump). The "review due" escalation
      # it can also print is for the developer; checkout is shallow here, so
      # the arch-review/<date> tags it measures from are usually absent and
      # the diff half stays quiet in CI.
      - if: needs.classify.outputs.code != 'false'
        run: uv run python scripts/arch_check.py
      # DL-211: this leg runs the suite plainly. Coverage is measured in the
      # `coverage` job below, on 3.14 only, where it is nearly free; below
      # 3.14 the same measurement costs 2-3x on this suite (no sys.monitoring
      # branch support), for a gate this leg does not need to also pay for.
      # DL-354: four pytest-xdist workers, one test file each at a time. The
      # count is pinned, never `auto`, so the runs that accepted it describe
      # the configuration that runs; the plugin's controller merges the
      # workers' transition hits.
      - if: needs.classify.outputs.code != 'false'
        run: uv run pytest -q -n 4 --dist loadfile

  # DL-351: the oracle the engine builds reproduces its golden digests
  # over the whole harness sample. Its own job, beside the test legs, so their timeout does not carry it; the
  # default suite replays the corpus part. About a minute locally.
  goldens:
    needs: classify
    if: ${{ !cancelled() && needs.classify.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra dev
      - run: uv run python tests/oracle_goldens.py replay

  # DL-211: coverage is a property of the code, not of the interpreter running
  # it, so it is measured once, where measuring is free. On 3.14, `coverage`
  # picks its `sys.monitoring` core, which produced byte-identical line and
  # branch data to the C tracer used below 3.14 across the suite when checked;
  # below 3.14 sys.monitoring cannot measure branches, so the C tracer is 2-3x
  # slower for the same result. `coverage report` -- not the run step -- is
  # what fails the build.
  coverage:
    needs: classify
    if: ${{ !cancelled() && needs.classify.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    # the whole suite under coverage on four workers, subprocesses measured, runs past the
    # test legs' fifteen minutes; twenty-five leaves room without hiding a hung test
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
      - run: uv sync --locked --extra dev
      - run: uv run ruff check src tests examples
      - run: uv run ruff format --check src tests scripts examples
      - run: uv run mypy
      # DL-75: blocking checks only decide the exit code (duplicate bodies,
      # new private cross-module imports in src/, unresolvable citations, an
      # IR-F shape change without an IR_VERSION bump). The "review due" escalation
      # it can also print is for the developer; checkout is shallow here, so
      # the arch-review/<date> tags it measures from are usually absent and
      # the diff half stays quiet in CI.
      - run: uv run python scripts/arch_check.py
      # DL-105: the suite runs under branch coverage, and the state-machine
      # modules are held at 100% of it (DL-269 widened the scope past the
      # concurrency tier; [tool.coverage.report] in pyproject names the
      # modules and argues the scope). `coverage run` replaces the bare pytest
      # rather than joining it -- running the suite twice to measure it once is
      # a minute of CI for nothing. The report step is what fails the build.
      # DL-265: the run also measures the supervisor and wrapper subprocesses,
      # which write one data file each, so `coverage combine` comes before the
      # report. The gate is unchanged. The branch report prints branch-only
      # numbers for the whole package and never fails the build.
      # The erase mirrors docs/agent-workflow.md. A fresh checkout has no
      # data files, so here it does nothing.
      - run: uv run coverage erase
      # DL-354: the same four workers as the test legs; `patch = ["subprocess"]`
      # measures each worker, and `coverage combine` merges their data files.
      - run: uv run coverage run -m pytest -q -n 4 --dist loadfile
      - run: uv run coverage combine
      - run: uv run coverage report
      - run: uv run python scripts/branch_coverage.py
      - run: uv run python scripts/transition_coverage.py

  # DL-77: the viz --format explore page's controls exist only in a browser, and
  # byte assertions could not see a WebKit-fatal defect in them. Its own job, on
  # one python: the engines are a ~200MB download the matrix above must not pay
  # three times, and the tests are opt-in (DSL41_BROWSER_TESTS), so the fast
  # suite stays browser-free. ~3 min wall clock, ~2 of it the browser install;
  # it runs beside the matrix job, so the workflow is no slower.
  explore-page:
    needs: classify
    if: ${{ !cancelled() && needs.classify.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    # Three browser installs take about eight minutes on a slow runner and the
    # 324 browser tests about nine; 15 cancelled two green runs at 66% on
    # 2026-10-01. 30 still turns a real hang into a fast red X.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra dev
      - run: uv run playwright install --with-deps chromium webkit firefox
      # The opt-in gate is a module-level skip, so a run that lost
      # DSL41_BROWSER_TESTS prints "1 skipped" and exits 0 -- green while
      # testing nothing, the same silent-success shape DL-77 was about.
      # Collect first and refuse a run that found no tests.
      - name: explore page in three engines
        env:
          DSL41_BROWSER_TESTS: "1"
        run: |
          set -euo pipefail
          n=$(uv run pytest -q --collect-only tests/test_viz_explore_browser.py | grep -c '::' || true)
          if [ "$n" -lt 9 ]; then
            echo "collected $n browser tests (expected >= 9, one per control per engine):"
            echo "the DSL41_BROWSER_TESTS opt-in is not reaching pytest, so this job would"
            echo "have passed without running anything."
            exit 1
          fi
          echo "collected $n browser tests"
          uv run pytest -q tests/test_viz_explore_browser.py
          uv run pytest -q tests/test_autorep_snapshot.py -k test_converted_fixture_native_viewer_import
