# Dependency vulnerability audit: pip-audit over the locked, non-dev
# dependency set (uv export pins the exact transitive closure; --no-deps
# audits precisely that set with no re-resolution). The set includes the
# [ui] extra, because the release ships requirements-ui.txt too (DL-215).
# Weekly schedule catches advisories published between pushes. README's
# "vulnerabilities" brick badges this workflow.

name: vulnerabilities

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv export --frozen --no-dev --no-emit-project --extra ui -o requirements.txt
      - run: uvx pip-audit --no-deps -r requirements.txt
