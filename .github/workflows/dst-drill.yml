# The DST drill (examples/dst-drill/): the real runner on a libfaketime clock
# sixty times as fast, across the DST changes of Europe/London and
# America/New_York, a local midnight with a seal, and a restart across a
# change. Each step runs one scenario in the drill's container and compares
# it with `dsl41 rehearse` over the same window; a difference fails the step.
#
# Each run root, both traces and the lint output land in a mounted work
# directory; when a step fails, the last step uploads them as an artifact.
#
# Manual only (workflow_dispatch). It is not part of the default gate.
# tests/test_dst_drill.py holds the comparator and checks that this file runs
# every scenario. Dispatch it again after a change to the scheduler, the
# timezone rules, L023 or the drill.

name: dst-drill

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: build the drill's image
        run: |
          docker build -f examples/dst-drill/Dockerfile -t dsl41-dst-drill .
          # the image's user (uid 1001) writes the work directory
          mkdir -p "$RUNNER_TEMP/dst-drill" && chmod 777 "$RUNNER_TEMP/dst-drill"

      - name: London, spring forward
        run: docker run --rm --init -v "$RUNNER_TEMP/dst-drill:/tmp/dst-drill" dsl41-dst-drill python examples/dst-drill/drill.py london-spring

      - name: London, fall back
        run: docker run --rm --init -v "$RUNNER_TEMP/dst-drill:/tmp/dst-drill" dsl41-dst-drill python examples/dst-drill/drill.py london-fall

      - name: New York, spring forward
        run: docker run --rm --init -v "$RUNNER_TEMP/dst-drill:/tmp/dst-drill" dsl41-dst-drill python examples/dst-drill/drill.py newyork-spring

      - name: New York, fall back
        run: docker run --rm --init -v "$RUNNER_TEMP/dst-drill:/tmp/dst-drill" dsl41-dst-drill python examples/dst-drill/drill.py newyork-fall

      - name: a local midnight with a live seal, its audit and the next period
        run: docker run --rm --init -v "$RUNNER_TEMP/dst-drill:/tmp/dst-drill" dsl41-dst-drill python examples/dst-drill/drill.py london-midnight-seal

      - name: a clean stop before the fall change and a resume after it
        run: docker run --rm --init -v "$RUNNER_TEMP/dst-drill:/tmp/dst-drill" dsl41-dst-drill python examples/dst-drill/drill.py london-fall-restart

      - name: pack the work directories of a failed run
        if: failure()
        run: tar -C "$RUNNER_TEMP" --exclude='*.sock' -czf "$RUNNER_TEMP/dst-drill-evidence.tgz" dst-drill

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: dst-drill-evidence
          path: ${{ runner.temp }}/dst-drill-evidence.tgz
          if-no-files-found: warn
