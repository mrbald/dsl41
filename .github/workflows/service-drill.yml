# DL-218: the service-level drill for the nightbank deployment example
# (examples/nightbank/deploy/). It installs dsl41, the launcher, the access
# map and both units on a runner with systemd, and checks the claims the
# example makes: the first start, a same-root restart, a detached job that
# survives an engine stop, a configuration refusal (a changed estate) that
# does not restart-loop -- the two access-map refusals prove the same
# systemd claim and are pinned instead in tests/test_nightbank_deploy.py --
# a sealed engine that stays stopped until an operator opens the next
# period, the managed quiescence and restore of deployment-runbook ss2b,
# a host reboot that the enabled units resume from, the signals of "What to
# watch" (with a violation injected into the engine unit), the configure
# and stop-and-recover recipes of ss0, a SIGKILL of the engine and of the
# supervisor, and the four upgrade rows of ss7 with their rollbacks
# (DL-266). Rows 1 to 3 run with two installs of one build: their
# mechanics, not a qualified version pair. Row 4 runs from v1.7.0 on PyPI
# to the build under test. The install, the first start and a final
# retirement run ss0's recipe blocks as the runbook prints them (DL-268).
#
# Manual only (workflow_dispatch). It is not part of the default gate. It
# passed every step it had then on GitHub's Ubuntu 24.04 runner at c1e6b0c
# on 2026-10-04 (DL-271); its first pass there was on 2026-09-29 (DL-223).
# The watch, configure, kill-engine, kill-supervisor, stop-recover and
# rollback steps were added after that, and the sealed, upgrade-fresh-root,
# upgrade-coordinated, upgrade-old-release and upgrade-state-machine steps
# changed; they have run only in drill-local.sh.
# Dispatch it again after a change to the units, the launcher or the
# drill. Each step
# runs one step of drill-steps.sh; drill-local.sh runs the same steps in a
# local podman container (DL-266). A test holds this list to the script's.

name: service-drill

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # uv only exports the lock; the service's venv is the system python's
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: install dsl41, the nightbank estate, the launcher, the map and the units
        run: bash examples/nightbank/deploy/drill-steps.sh install

      - name: first start is a genesis, beside a supervisor in its own unit
        run: bash examples/nightbank/deploy/drill-steps.sh first-start

      - name: same-root restart resumes
        run: bash examples/nightbank/deploy/drill-steps.sh restart

      - name: a detached job survives an engine stop
        run: bash examples/nightbank/deploy/drill-steps.sh detached

      - name: a changed estate is refused without a restart loop
        run: bash examples/nightbank/deploy/drill-steps.sh refusal

      - name: a sealed engine stays stopped until the next period is opened
        run: bash examples/nightbank/deploy/drill-steps.sh sealed

      - name: managed quiescence keeps both units stopped past RestartSec
        run: bash examples/nightbank/deploy/drill-steps.sh quiesce

      - name: a copy of the root and the anchor restores at the recorded paths
        run: bash examples/nightbank/deploy/drill-steps.sh restore

      - name: a host reboot starts the enabled units, which resume the same root
        run: bash examples/nightbank/deploy/drill-steps.sh reboot

      - name: the signals of What to watch read true, and an injected violation shows in the journal
        run: bash examples/nightbank/deploy/drill-steps.sh watch

      - name: the configure recipe sets the socket group, the tiers and the receipts, and a changed profile is refused
        run: bash examples/nightbank/deploy/drill-steps.sh configure

      - name: a SIGKILL of the engine is restarted by the unit and the run resumes
        run: bash examples/nightbank/deploy/drill-steps.sh kill-engine

      - name: a SIGKILL of the supervisor is restarted, the engine resumes, and the lease renews
        run: bash examples/nightbank/deploy/drill-steps.sh kill-supervisor

      - name: stop and recover from a crash loop, replay a request, rerun a job
        run: bash examples/nightbank/deploy/drill-steps.sh stop-recover

      - name: upgrade by the resume-safe row resumes the engine and keeps the supervisor
        run: bash examples/nightbank/deploy/drill-steps.sh upgrade-resume-safe

      - name: upgrade by the silent-note row opens the next period in a fresh root
        run: bash examples/nightbank/deploy/drill-steps.sh upgrade-fresh-root

      - name: the silent-note row's rollback opens another fresh root on the old venv
        run: bash examples/nightbank/deploy/drill-steps.sh upgrade-fresh-root-rollback

      - name: upgrade by the coordinated row replaces both units and resumes the same root
        run: bash examples/nightbank/deploy/drill-steps.sh upgrade-coordinated

      - name: the coordinated row's rollback replaces both units again
        run: bash examples/nightbank/deploy/drill-steps.sh upgrade-coordinated-rollback

      - name: an estate on the old release, v1.7.0 from PyPI
        run: bash examples/nightbank/deploy/drill-steps.sh upgrade-old-release

      - name: upgrade by the state-machine row starts a new estate on this build
        run: bash examples/nightbank/deploy/drill-steps.sh upgrade-state-machine

      - name: the state-machine row's rollback resumes the old estate on the old venv
        run: bash examples/nightbank/deploy/drill-steps.sh upgrade-state-machine-rollback

      - name: a retired estate stays stopped after a reload, and its history audits
        run: bash examples/nightbank/deploy/drill-steps.sh retire

      - name: diagnostics and teardown
        if: always()
        run: bash examples/nightbank/deploy/drill-steps.sh diagnostics
