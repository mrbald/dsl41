# The service drill (examples/nightbank/deploy/DRILL.md): dsl41 installed under
# dsl41-engine.service in a podman container with systemd as PID 1, on Ubuntu 24.04 and on
# Rocky Linux 8, with every row of drill-steps.sh run against the one unit. The same
# drill-local.sh runs it on a maintainer's machine.
#
# Manual only (workflow_dispatch). It is not part of the default gate. Dispatch it after a
# change to the unit, the engine's start, stop or restart, or the drill.

name: service-drill

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  drill:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu, el8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # uv builds the wheels and exports the lock on the runner; the container installs them
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: provision the container engine
        run: sudo apt-get update -q && sudo apt-get install -y podman
      # a rootful engine sets up the systemd container's cgroup without a user session
      - name: the service drill on ${{ matrix.image }}
        env:
          PODMAN: sudo podman
        run: bash examples/nightbank/deploy/drill-local.sh --image ${{ matrix.image }} all
