# The service drill (examples/nightbank/deploy/DRILL.md): dsl41 installed under
# dsl41-engine.service in a podman container with systemd as PID 1, on Ubuntu 24.04 and on
# Rocky Linux 8, with every row of drill-steps.sh run against the one unit. The same
# drill-local.sh runs it on a maintainer's machine.
#
# DL-441: nightly and relevant PRs run both images; manual dispatch remains available.

name: service-drill

on:
  workflow_dispatch:
  schedule:
    - cron: '37 1 * * *'
  pull_request:
    paths:
      - 'src/**'
      - 'grammars/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'scripts/wargame.*'
      - 'examples/nightbank/**'
      - '.github/workflows/service-drill.yml'

      - '!examples/**/*.md'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  drill:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu, el8]
    steps:
      - name: prepare service evidence
        run: |
          echo "DRILL_EVIDENCE=$RUNNER_TEMP/service-evidence" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # uv builds the wheels and exports the lock on the runner; the container installs them
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: provision the container engine
        run: |
          mkdir -p "$DRILL_EVIDENCE"
          { sudo apt-get update -q && sudo apt-get install -y podman; } 2>&1 | tee "$DRILL_EVIDENCE/setup.log"
      # a rootful engine sets up the systemd container's cgroup without a user session
      - name: the service drill on ${{ matrix.image }}
        env:
          PODMAN: sudo podman
        run: |
          bash examples/nightbank/deploy/drill-local.sh --image ${{ matrix.image }} all 2>&1 | tee "$DRILL_EVIDENCE/drill.log"
      - name: make restart evidence readable
        if: always()
        run: |
          if sudo test -d "$DRILL_EVIDENCE/restart-faults"; then
            sudo chown -R -- "$(id -u):$(id -g)" "$DRILL_EVIDENCE/restart-faults"
            sudo chmod -R -- u+rX "$DRILL_EVIDENCE/restart-faults"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: service-evidence-${{ matrix.image }}
          path: ${{ env.DRILL_EVIDENCE }}
          if-no-files-found: warn
