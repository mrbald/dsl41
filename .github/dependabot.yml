# Action versions are pinned by commit in the workflows, with the version in a
# trailing comment (DL-222); this is what moves them, comment included, when a
# release lands, rather than leaving them to rot unnoticed.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps"
