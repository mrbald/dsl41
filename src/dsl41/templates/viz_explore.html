<!-- customElements polyfill FIRST: cytoscape-context-menus builds its menu
     from customized built-in elements (class extends HTMLDivElement +
     customElements.define(..., {extends: "div"})), which WebKit has never
     implemented -- without this, `cy.contextMenus` throws "Illegal
     constructor" in Safari. The polyfill feature-detects and is inert where
     the browser is native (DL-77). -->
<script>__DSL41_CUSTOM_ELEMENTS_JS__</script>
<script>__DSL41_CYTOSCAPE_JS__</script>
<script id="graph-data" type="application/json">__DSL41_ELEMENTS_JSON__</script>
<script>
"use strict";

/* esbuild --global-name wraps the module namespace; the registered
   cytoscape constructor sits at .default. */
var cytoscape = cyBundle.default;

var DIRECTION = "__DSL41_ELK_DIRECTION__";
var LABEL_ZOOM = 0.6; /* edge labels overlap at fit zoom; hide below this */
/* Orthogonal edge routing along ELK's layering axis: a bezier between node
   centres reads as a spline tangle and hides the layers ELK just computed. */
var TAXI_DIRECTION = DIRECTION === "DOWN" ? "vertical" : "horizontal";

function elkLayout(extra) {
  var opts = {
    name: "elk",
    nodeDimensionsIncludeLabels: true,
    fit: true,
    padding: 30,
    elk: {
      algorithm: "layered",
      "elk.direction": DIRECTION,
      "elk.hierarchyHandling": "INCLUDE_CHILDREN"
    }
  };
  if (extra) Object.keys(extra).forEach(function (k) { opts[k] = extra[k]; });
  return opts;
}

var elements = JSON.parse(document.getElementById("graph-data").textContent);

/* The expand-collapse api, once the (optional, guarded) extension is up;
   null means the page runs without box folding. Declared here because the
   node label style below asks it how many members a collapsed box stands
   for, and a style function must not throw before the extension exists. */
var ec = null;

function nodeLabel(ele) {
  if (ec && ele.hasClass("cy-expand-collapse-collapsed-node")) {
    return ele.data("label") + " (" + ec.getCollapsedChildrenRecursively(ele).nodes().length + ")";
  }
  return ele.data("label");
}

var cy = cytoscape({
  container: document.getElementById("cy"),
  elements: elements,
  boxSelectionEnabled: false,
  style: [
    { selector: "node", style: {
        shape: "round-rectangle",
        width: function (ele) {
          return Math.max(30, nodeLabel(ele).length * 6.5 + 14);
        },
        height: 24,
        label: nodeLabel,
        "text-valign": "center",
        "text-halign": "center",
        "font-size": 11,
        color: "#111827",
        "background-color": "#ffffff",
        "border-width": 1,
        "border-color": "#374151"
    } },
    { selector: "node.fw", style: {  /* file watcher: source/trigger */
        shape: "diamond",
        height: 34,
        "background-color": "#def7ec",
        "border-color": "#046c4e"
    } },
    { selector: "node.ext", style: {  /* endpoint outside the catalog */
        "border-style": "dashed",
        "background-color": "#f3f4f6",
        "border-color": "#6b7280",
        color: "#374151"
    } },
    { selector: "node.global", style: {  /* global variable producer */
        shape: "rhomboid",
        "background-color": "#fdf6b2",
        "border-color": "#8a6d00"
    } },
    { selector: "node.box", style: {  /* compound container */
        shape: "round-rectangle",
        "text-valign": "top",
        "background-color": "#ece9fd",
        "background-opacity": 0.3,
        "border-color": "#5b21b6",
        "font-weight": "bold"
    } },
    { selector: "node.cy-expand-collapse-collapsed-node", style: {  /* a collapsed box: one node standing for its members */
        "text-valign": "center",
        "background-opacity": 1,
        "border-width": 2,
        "border-style": "double"
    } },
    { selector: "edge", style: {
        "curve-style": "taxi",
        "taxi-direction": TAXI_DIRECTION,
        "taxi-turn": "50%",
        "taxi-turn-min-distance": 8,
        width: 1.5,
        "line-color": "#4b5563",
        "target-arrow-shape": "triangle",
        "target-arrow-color": "#4b5563",
        "arrow-scale": 0.9,
        label: "data(label)",
        "font-size": 9,
        color: "#374151",
        "text-rotation": "autorotate",
        "text-background-color": "#ffffff",
        "text-background-opacity": 0.8,
        "text-background-padding": "1px"
    } },
    { selector: "edge.nesting", style: {  /* member <-> its own box: see below */
        "curve-style": "bezier"
    } },
    { selector: "edge.assumed", style: {
        "line-style": "dashed",
        "line-color": "#b45309",
        "target-arrow-color": "#b45309"
    } },
    { selector: "edge.redesign", style: {
        "line-style": "dotted",
        width: 2,
        "line-color": "#b91c1c",
        "target-arrow-color": "#b91c1c"
    } },
    { selector: "edge.nolabel", style: {
        "text-opacity": 0,
        "text-background-opacity": 0
    } },
    { selector: "edge.cy-expand-collapse-meta-edge", style: {  /* stands for every edge that crossed a collapsed box's border */
        label: "",
        "line-style": "solid",
        width: 2,
        "line-color": "#5b21b6",
        "target-arrow-color": "#5b21b6"
    } },
    { selector: ".hidden", style: { display: "none" } },
    { selector: "node.hit", style: {
        "border-width": 3,
        "border-color": "#1d4ed8"
    } },
    { selector: ":selected", style: {
        "overlay-color": "#1d4ed8",
        "overlay-opacity": 0.15,
        "overlay-padding": 4
    } }
  ]
});

/* An edge between a node and one of its own ancestors has overlapping
   endpoints -- taxi routing cannot draw it at all ("invalid endpoints"), and
   the dependency would just vanish from the picture. Those few keep the
   bezier. Classified at load and again after every collapse or expand: a
   collapse rewires a member's edges onto its box, so a meta-edge can land on
   a box's own ancestor. */
function classifyNesting() {
  cy.edges().forEach(function (edge) {
    var src = edge.source(), dst = edge.target();
    var nested = src.ancestors().anySame(dst) || dst.ancestors().anySame(src);
    edge.toggleClass("nesting", nested);
  });
}
classifyNesting();

var stats = document.getElementById("stats");
var relayoutToggle = document.getElementById("relayout");

/* A control this browser could not give us, named for the operator: every
   updateStats keeps it, so a degraded page never looks like a whole one. */
var lostFeature = "";

/* The totals are the emitted graph's, fixed at load: a collapse takes a
   box's members and their inner edges out of the graph and re-points the
   border-crossing edges at the box, so live counts would read as a loss. */
var TOTAL_NODES = elements.nodes.length, TOTAL_EDGES = elements.edges.length;

function updateStats(suffix) {
  var collapsed = cy.nodes(".cy-expand-collapse-collapsed-node").length;
  var vn = cy.nodes(":visible").length, ve = cy.edges(":visible").length;
  stats.textContent = "visible " + vn + " / " + TOTAL_NODES + " nodes · "
    + ve + " / " + TOTAL_EDGES + " edges"
    + (collapsed ? " · " + collapsed + (collapsed === 1 ? " box" : " boxes") + " collapsed" : "")
    + (suffix ? " · " + suffix : "") + lostFeature;
}

/* Edge labels overlap at fit zoom on a bank-scale graph: hide them below
   LABEL_ZOOM, restore when the operator zooms in. */
var labelsShown = null;
function updateEdgeLabels() {
  var show = cy.zoom() >= LABEL_ZOOM;
  if (show === labelsShown) return;
  labelsShown = show;
  cy.edges().toggleClass("nolabel", !show);
}
cy.on("zoom", updateEdgeLabels);
/* edges an expand just restored carry whatever class they were removed
   with; forget the memo so the current zoom decides again for all of them */
function refreshEdgeLabels() { labelsShown = null; updateEdgeLabels(); }

function relayoutOrFit(suffix) {
  if (relayoutToggle.checked) {
    var visible = cy.elements(":visible");
    var layout = visible.layout(elkLayout());
    layout.on("layoutstop", function () { updateStats(suffix); });
    layout.run();
  } else {
    cy.fit(cy.nodes(":visible"), 40);
  }
  updateStats(suffix);
}

/* focus = hide non-selected, keeping compound ancestors (members without
   their box do not render), then ELK re-layout of the visible subset
   (toggle off = fit only). `how` names the rule that chose the set, in
   #stats, so a picture drawn "via boxes" is never mistaken for one drawn
   from the edges alone. */
function focusOn(keep, how) {
  keep = keep.union(keep.ancestors());
  cy.batch(function () {
    cy.nodes().addClass("hidden");
    keep.removeClass("hidden");
  });
  relayoutOrFit(how);
}

function showAll() {
  cy.batch(function () {
    cy.elements().removeClass("hidden");
    cy.nodes().removeClass("hit");
  });
  relayoutOrFit();
}

/* ------------------------------------------------------------ details panel */

var details = document.getElementById("details");
var dTitle = document.getElementById("d-title");
var dRows = document.getElementById("d-rows");

function showDetails(title, rows) {
  dTitle.textContent = title;
  dRows.replaceChildren();
  rows.forEach(function (row) {
    if (row[1] === null || row[1] === undefined || row[1] === "") return;
    var tr = document.createElement("tr");
    var th = document.createElement("th");
    th.textContent = row[0];
    var td = document.createElement("td");
    if (row[2] === "code") {
      var code = document.createElement("code");
      code.textContent = row[1];
      td.appendChild(code);
    } else {
      td.textContent = row[1]; /* full text, never truncated */
    }
    tr.appendChild(th);
    tr.appendChild(td);
    dRows.appendChild(tr);
  });
  details.hidden = false;
}

document.getElementById("d-close").addEventListener("click", function () {
  details.hidden = true;
});

cy.on("tap", "node", function (evt) {
  var n = evt.target, d = n.data();
  var members = null;
  if (d.kind === "BOX") {
    var away = ec ? ec.getCollapsedChildrenRecursively(n).nodes().length : 0;
    members = (n.descendants().length + away) + (away ? " (collapsed)" : "");
  }
  showDetails(d.id, [
    ["kind", d.kind],
    ["members", members],
    ["schedule", d.schedule],
    ["command / watched file", d.detail, "code"],
    ["owning box", d.parent]
  ]);
});

/* an end the expand-collapse extension remembers is a node; a plain id
   is accepted too, so a future build that stores ids reads the same */
function endId(end) { return end && typeof end.id === "function" ? end.id() : String(end); }

cy.on("tap", "edge", function (evt) {
  var e = evt.target, d = e.data();
  /* a meta-edge IS the original edge, re-pointed at a collapsed box; its
     annotations are its own, and the row names the member it really joins */
  var ends = e.hasClass("cy-expand-collapse-meta-edge") ? d.originalEnds : null;
  showDetails(d.source + " → " + d.target, [
    ["stands for", ends ? endId(ends.source) + " → " + endId(ends.target) + " (inside a collapsed box)" : null],
    ["via", d.via],
    ["lookback", d.lookback],
    ["class", d.cls],
    ["mapping row", d.mapping_row],
    ["assumption", d.assumption]
  ]);
});

cy.on("tap", function (evt) {
  if (evt.target === cy) details.hidden = true;
});

/* ----------------------------------------------------------------- toolbar */

document.getElementById("show-all").addEventListener("click", showAll);
document.getElementById("fit").addEventListener("click", function () {
  cy.fit(cy.nodes(":visible"), 40);
});

/* Substring search. Hits hidden by a previous focus are un-hidden, and a
   collapsed box holding a hit is expanded first -- a search that cannot
   find a hidden or a collapsed node is a lying search. */
document.getElementById("search").addEventListener("keydown", function (evt) {
  if (evt.key !== "Enter") return;
  var query = evt.target.value.trim().toLowerCase();
  cy.nodes().removeClass("hit");
  if (!query) { updateStats(); return; }
  var matches = function (n) { return n.data("id").toLowerCase().indexOf(query) !== -1; };
  if (ec) {
    cy.nodes(".cy-expand-collapse-collapsed-node").forEach(function (box) {
      if (ec.getCollapsedChildrenRecursively(box).nodes().some(matches)) {
        ec.expandRecursively(box, { layoutBy: null });
      }
    });
  }
  var hits = cy.nodes().filter(matches);
  if (hits.empty()) {
    updateStats("no match for “" + query + "”");
    return;
  }
  cy.batch(function () {
    hits.union(hits.ancestors()).removeClass("hidden");
    hits.addClass("hit");
  });
  updateStats(hits.length + " hit" + (hits.length === 1 ? "" : "s"));
  cy.fit(hits, 60);
});

/* ------------------------------------------------------- box collapse / expand */

/* cytoscape-expand-collapse (DL-190): a collapsed box stays in the graph as
   one node; its members and their edges leave it, remembered on the box,
   and every edge that crossed the box's border becomes one meta-edge to
   the box. Optional and guarded like the menu (DL-77): a throw costs this
   feature alone, and #stats says so. It sits ABOVE the initial layout on
   purpose -- the boxes the emitter marked `collapsed` (--collapse-threshold)
   have to fold before the first layout or the first picture is the wrong
   one -- and the guard, not the position, is what keeps everything else
   alive when it fails. */
try {
  cy.expandCollapse({
    layoutBy: function () { relayoutOrFit(); },  /* the re-layout toggle decides */
    fisheye: false,
    animate: false,
    undoable: false,
    cueEnabled: true,
    expandCollapseCuePosition: "top-left",
    expandCollapseCueSize: 12,
    expandCollapseCueLineSize: 8,
    zIndex: 15  /* over the graph, under #details (20) and the menu (1000) */
  });
  ec = cy.expandCollapse("get");
  cy.on("expandcollapse.aftercollapse expandcollapse.afterexpand", function () {
    classifyNesting();
    refreshEdgeLabels();
  });
  /* the emitter's initial folds, deepest first: an inner box collapsed
     before its outer one is remembered collapsed, and comes back so */
  cy.nodes("node.box[?collapsed]").sort(function (a, b) {
    return b.ancestors().length - a.ancestors().length;
  }).forEach(function (box) {
    if (box.inside() && ec.isCollapsible(box)) ec.collapse(box, { layoutBy: null });
  });
} catch (err) {
  lostFeature += " · box collapse unavailable in this browser";
  if (window.console) console.error("box collapse unavailable:", err);
}

function collapseBox(box) { if (ec && ec.isCollapsible(box)) ec.collapse(box); }
function expandBox(box) { if (ec && ec.isExpandable(box)) ec.expand(box); }
cy.on("dbltap", "node.box", function (evt) {
  var box = evt.target;
  if (!ec) return;
  if (ec.isExpandable(box)) expandBox(box); else collapseBox(box);
});
document.getElementById("collapse-all").addEventListener("click", function () {
  if (ec) ec.collapseAll();
});
document.getElementById("expand-all").addEventListener("click", function () {
  if (ec) ec.expandAll();
});

/* ------------------------------------------------------------ initial layout */

var initial = cy.elements().layout(elkLayout());
initial.on("layoutstop", function () {
  updateEdgeLabels();
  updateStats();
});
initial.run();

/* ------------------------------------------------------ tracing through boxes */

var traceToggle = document.getElementById("trace-boxes");
function viaBoxes() { return traceToggle.checked; }
function howLabel(what) { return what + (viaBoxes() ? ", via boxes" : ", edges only"); }

/* One step upstream. Edges only: the producers this node's own condition
   names. Through boxes (SEM-10): a member starts only when its box is
   RUNNING and its own conditions hold, so every enclosing box, and what
   gates that box, is upstream too. Siblings are not -- they gate nothing
   of this node's start -- and the rule never adds one. Computed here over
   `parent` rather than emitted as edges: a box->member edge for the start
   gate and a member->box edge for the completion fold would be a cycle,
   and a fan-in over it would pull every sibling in. */
function fanInStep(nodes) {
  var next = nodes.incomers("node");
  if (viaBoxes()) {
    var boxes = nodes.ancestors();
    next = next.union(boxes).union(boxes.incomers("node"));
  }
  return next;
}

/* One step downstream. Edges only: the consumers whose conditions name this
   node. Through boxes: a box's start releases its members (SEM-10), and a
   member's completion is a vote in every enclosing box's fold (SEM-11), so
   the box's consumers are downstream of the member. Overrides that name a
   member (SEM-12) are already explicit edges and need nothing here. */
function fanOutStep(nodes) {
  var next = nodes.outgoers("node");
  if (viaBoxes()) {
    next = next.union(nodes.children()).union(nodes.ancestors().outgoers("node"));
  }
  return next;
}

/* the closure of a step: the tree items */
function closure(start, step) {
  var seen = start, frontier = start;
  while (frontier.nonempty()) {
    frontier = step(frontier).difference(seen);
    seen = seen.union(frontier);
  }
  return seen;
}

/* ------------------------------------------------------------- context menu */

/* LAST, and guarded: cytoscape-context-menus is the one OPTIONAL part of the
   page, and it registers customized built-in elements -- unimplemented in
   WebKit until the polyfill above supplies them. Everything essential (the
   ELK layout, the toolbar, the search) is already wired above, so a plugin
   that still throws costs exactly itself, and says so in #stats instead of
   leaving a page whose controls are quietly dead (DL-77). */

function target(evt) { return evt.target || evt.cyTarget; }

var menuItems = [
  { id: "fan-in", content: "focus fan-in (direct)", selector: "node",
    onClickFunction: function (evt) {
      var n = target(evt); focusOn(n.union(fanInStep(n)), howLabel("fan-in"));
    } },
  { id: "fan-out", content: "focus fan-out (direct)", selector: "node",
    onClickFunction: function (evt) {
      var n = target(evt); focusOn(n.union(fanOutStep(n)), howLabel("fan-out"));
    } },
  { id: "fan-in-tree", content: "focus fan-in tree", selector: "node",
    onClickFunction: function (evt) {
      var n = target(evt); focusOn(closure(n, fanInStep), howLabel("fan-in tree"));
    } },
  { id: "fan-out-tree", content: "focus fan-out tree", selector: "node",
    onClickFunction: function (evt) {
      var n = target(evt); focusOn(closure(n, fanOutStep), howLabel("fan-out tree"));
    } },
  { id: "both-trees", content: "focus both trees", selector: "node",
    onClickFunction: function (evt) {
      var n = target(evt);
      focusOn(closure(n, fanInStep).union(closure(n, fanOutStep)), howLabel("both trees"));
    } },
  { id: "neighbours", content: "focus this + neighbours", selector: "node",
    onClickFunction: function (evt) {
      var n = target(evt);
      focusOn(n.union(fanInStep(n)).union(fanOutStep(n)), howLabel("neighbours"));
    }, hasTrailingDivider: true },
  { id: "hide", content: "hide this node", selector: "node",
    onClickFunction: function (evt) {
      var n = target(evt);
      n.union(n.descendants()).addClass("hidden");
      updateStats();
    }, hasTrailingDivider: true },
  /* item ids become DOM ids of the menu entries -- keep them distinct
     from the toolbar's #show-all/#fit (review finding: duplicate ids) */
  { id: "menu-show-all", content: "show all", selector: "node",
    coreAsWell: true, onClickFunction: showAll },
  { id: "menu-fit", content: "fit", selector: "node", coreAsWell: true,
    onClickFunction: function () { cy.fit(cy.nodes(":visible"), 40); } }
];
/* the box items exist only when box collapse does: a menu entry that
   silently does nothing is the DL-77 shape in miniature */
if (ec) {
  menuItems.splice(7, 0,
    { id: "collapse", content: "collapse this box", selector: "node.box:parent",
      onClickFunction: function (evt) { collapseBox(target(evt)); } },
    { id: "expand", content: "expand this box",
      selector: "node.cy-expand-collapse-collapsed-node",
      onClickFunction: function (evt) { expandBox(target(evt)); },
      hasTrailingDivider: true });
  menuItems.push(
    { id: "menu-collapse-all", content: "collapse all boxes", selector: "node",
      coreAsWell: true, onClickFunction: function () { ec.collapseAll(); } },
    { id: "menu-expand-all", content: "expand all boxes", selector: "node",
      coreAsWell: true, onClickFunction: function () { ec.expandAll(); } });
}

try {
  cy.contextMenus({ menuItems: menuItems });
} catch (err) {
  lostFeature += " · context menu unavailable in this browser";
  updateStats();
  if (window.console) console.error("context menu unavailable:", err);
}
</script>
</body>
</html>
