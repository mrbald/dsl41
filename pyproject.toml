[project]
name = "dsl41"
version = "1.8.0"
description = "AutoSys->Stonebranch migration compiler: JIL frontend, semantic IR, linter, Mermaid visualizer, equivalence validator, UC backend, Python DSL."
dynamic = ["readme"]
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "LICENSING.md", "COMMERCIAL.md", "THIRD_PARTY_LICENSES"]
authors = [{ name = "dsl41 authors", email = "mail@bobah.net" }]
keywords = [
    "autosys",
    "jil",
    "stonebranch",
    "universal-controller",
    "workload-automation",
    "scheduler",
    "migration",
    "compiler",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Compilers",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "lark>=1.3",
    "pydantic>=2.7",
    "typer>=0.12",
]

[project.optional-dependencies]
# ss11 TUI: the core package keeps its three runtime deps (runner-design ss11).
# textual floor = the family the TUI is developed and tested against (DL-46);
# textual-serve floor = the version paired with that textual and verified
# against it (DL-47) -- claiming untested floors is how UIs break at install
# time.
ui = ["textual>=8", "textual-serve>=1.1"]
dev = [
    # pytest floor = 8.2, the release that took `reason=` on importorskip
    # (tests/test_viz_explore_browser.py explains its skip with one).
    "pytest>=8.2",
    "hypothesis>=6",
    # branch coverage over the concurrency tier, enforced at 100% ([tool.
    # coverage.report] says which modules and why). `[toml]` extra so the
    # config can live in pyproject with its reasoning beside it.
    "coverage[toml]>=7",
    "ruff>=0.6",
    "mypy>=1.10",
    "textual>=8",
    "textual-serve>=1.1",
    # DL-77: the explore page's cross-engine smoke test drives a real chromium/
    # webkit/firefox. Dev-only -- the package keeps its three runtime deps, and
    # the browsers themselves are a separate `playwright install` (absent = the
    # test skips), so a plain `pytest -q` needs neither.
    "playwright>=1.50",
]

[project.urls]
Repository = "https://github.com/mrbald/dsl41"
Issues = "https://github.com/mrbald/dsl41/issues"

[project.scripts]
dsl41 = "dsl41.cli:app"

[build-system]
requires = ["hatchling>=1.27,<2", "hatch-fancy-pypi-readme>=25.1,<26"]
build-backend = "hatchling.build"

# README.md links to repo files by relative path, which GitHub resolves and
# the PyPI project page does not. The readme is built from README.md at
# package build time with each relative link rewritten to the file on main.
# Absolute links, mail links and in-page anchors pass through unchanged.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|mailto:|#)([^)\s]+)\)'
replacement = '](https://github.com/mrbald/dsl41/blob/main/\1)'

# grammars/ lives at the repo root (docs reference it there); ship it inside the
# package so conditions._grammar_text() works from a wheel install too.
[tool.hatch.build.targets.wheel.force-include]
"grammars/condition.lark" = "dsl41/grammars/condition.lark"

[tool.ruff]
line-length = 100

# DL-203: the rule set is named here rather than inherited from ruff's
# default, because that default is a vendor choice and it moves. Ruff 0.16
# widened it and reported 780 findings on a tree that 0.15 called clean, with
# no line of this project's code changing. A lint gate a dependency bump can
# rewrite is not a gate. These four are the policy the tree was written and
# cleaned under; `--select E4,E7,E9,F` is clean under both versions. Widening
# the set is a real decision and gets its own entry -- the 373 naive-datetime
# findings in ruff 0.16's default are the candidate worth reading first.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
# DL-220: two non-strict flags, applied to whatever file set the gate
# already checks (docs/agent-workflow.md's `mypy src tests/uc_oracle.py`).
# `warn_return_any` catches a function that promises a real type and hands
# back `Any` from something untyped underneath; `disallow_any_generics`
# catches a bare `dict`/`list`/`tuple`/... standing in for its parameterized
# form. Neither is `strict = true` (that finds unrelated findings this
# slice did not scope -- see the decision log entry).
warn_return_any = true
disallow_any_generics = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# a wedged test dumps every thread's stack instead of hanging silently (the
# whole suite runs in ~30s; the v0.2.0 release hang burned a 6h CI slot mute)
faulthandler_timeout = 120

[tool.coverage.run]
# BRANCH coverage, not line: the concurrency tier is mostly decisions, and a
# guard whose false arm nothing takes is exactly the untested wiring this
# gate exists to find. Line coverage calls such a guard covered.
branch = true
source = ["src/dsl41"]
# DL-265: the suite starts Python subprocesses (the supervisor and the wrapper
# above all). `patch = ["subprocess"]` makes each of them measure itself and
# write its own data file, so `parallel` is on and `coverage combine` must run
# before `coverage report`. `sigterm` saves the data of a process that a test
# ends with SIGTERM and that installs no handler of its own. A process ended
# with SIGKILL loses its data; that is a floor on the number, not an error.
parallel = true
patch = ["subprocess"]
sigterm = true

[tool.coverage.report]
# The gate is scoped, and the scope is an argument rather than a convenience.
# These are the modules that implement docs/concurrency-model.md: the state
# owner, admission, the ledger and its lock, the outbox, the routing table,
# and the engine loop that drives them. A missed branch here is a rule the
# code states and no test holds it to -- which is how `superseded_reason`
# came to be proven as a function while the wiring that acts on it was never
# once exercised (DL-105).
#
# DL-269 widened the gate past the concurrency tier to the modules that own
# the other state machines: the oracle and its capacity queue, the scheduler,
# the control server, and the period, seal, retention and boundary code.
#
# The supervisor, the wrapper and their shared process-identity helpers are
# listed too. DL-265 measures those processes. `teardown_supervisor` ends a
# supervisor with SIGTERM so its data is written; the tests that simulate a
# crash still SIGKILL, and lose that process's data. A platform arm is driven
# through a stand-in for `sys.platform`, `/proc`, `ps` or the socket module, and
# a wake-up the wrapper would otherwise get only from its own `ps` probes (macOS)
# is sent by the test, so the number does not depend on the host.
#
# Seven more modules are listed: the attestation and the physical roll
# (attest, estate), the canonical form (canon), the calendar and condition
# interpreters (autocal, conditions), the control-plane verbs (cli_control)
# and the engine clocks (runner_clock). Other decision-shaped modules, such as
# runner_preflight, runner_history and cli_estate, are not. A branch in a listed
# module that only forged state reaches carries a pragma that names the invariant.
#
# Deliberately NOT listed: runner_adapters.py. Its numbers print in
# `scripts/branch_coverage.py`; widening the gate to it is the owner's call.
# The rest of the CLI, TUI, viz and compiler tiers are not state machines and get the
# suite's ordinary scrutiny, not this one.
include = [
    "src/dsl41/attest.py",
    "src/dsl41/autocal.py",
    "src/dsl41/boundary.py",
    "src/dsl41/canon.py",
    "src/dsl41/capacity.py",
    "src/dsl41/cli_control.py",
    "src/dsl41/conditions.py",
    "src/dsl41/estate.py",
    "src/dsl41/oracle.py",
    "src/dsl41/oracle_state.py",
    "src/dsl41/period.py",
    "src/dsl41/retention.py",
    "src/dsl41/runner.py",
    # the access perimeter (DL-146) is decision-shaped the same way: an
    # authorization guard whose false arm nothing takes is an untested
    # refusal, which on this module means an untested DENIAL path
    "src/dsl41/runner_access.py",
    "src/dsl41/runner_admission.py",
    "src/dsl41/runner_clock.py",
    "src/dsl41/runner_control.py",
    "src/dsl41/runner_effects.py",
    "src/dsl41/runner_hosts.py",
    "src/dsl41/runner_journal.py",
    "src/dsl41/runner_ledger.py",
    "src/dsl41/runner_procid.py",
    "src/dsl41/runner_scheduler.py",
    "src/dsl41/runner_startup.py",
    "src/dsl41/runner_supervisor.py",
    "src/dsl41/runner_wrapper.py",
    "src/dsl41/seal.py",
    # the shared state-machine core and its registry
    "src/dsl41/state_machine.py",
    "src/dsl41/machines.py",
]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    # a guard that fires only if this module's own invariants are already
    # broken. Every one carries a comment saying which invariant, because
    # "unreachable" is a claim and the comment is where it is made.
    "raise AssertionError",
]
