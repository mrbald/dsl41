[project]
name = "dsl41"
version = "1.3.0"
description = "AutoSys->Stonebranch migration compiler: JIL frontend, semantic IR, linter, Mermaid visualizer, equivalence validator, UC backend, Python DSL."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "LICENSING.md", "COMMERCIAL.md", "THIRD_PARTY_LICENSES"]
authors = [{ name = "dsl41 authors", email = "mail@bobah.net" }]
keywords = [
    "autosys",
    "jil",
    "stonebranch",
    "universal-controller",
    "workload-automation",
    "scheduler",
    "migration",
    "compiler",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Compilers",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "lark>=1.3",
    "pydantic>=2.7",
    "typer>=0.12",
]

[project.optional-dependencies]
# ss11 TUI: the core package keeps its three runtime deps (runner-design ss11).
# textual floor = the family the TUI is developed and tested against (DL-46);
# textual-serve floor = the version paired with that textual and verified
# against it (DL-47) -- claiming untested floors is how UIs break at install
# time.
ui = ["textual>=8", "textual-serve>=1.1"]
dev = [
    # pytest floor = 8.2, the release that took `reason=` on importorskip
    # (tests/test_viz_explore_browser.py explains its skip with one).
    "pytest>=8.2",
    "hypothesis>=6",
    # branch coverage over the concurrency tier, enforced at 100% ([tool.
    # coverage.report] says which modules and why). `[toml]` extra so the
    # config can live in pyproject with its reasoning beside it.
    "coverage[toml]>=7",
    "ruff>=0.6",
    "mypy>=1.10",
    "textual>=8",
    "textual-serve>=1.1",
    # DL-77: the explore page's cross-engine smoke test drives a real chromium/
    # webkit/firefox. Dev-only -- the package keeps its three runtime deps, and
    # the browsers themselves are a separate `playwright install` (absent = the
    # test skips), so a plain `pytest -q` needs neither.
    "playwright>=1.50",
]

[project.urls]
Repository = "https://github.com/mrbald/dsl41"
Issues = "https://github.com/mrbald/dsl41/issues"

[project.scripts]
dsl41 = "dsl41.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# grammars/ lives at the repo root (docs reference it there); ship it inside the
# package so conditions._grammar_text() works from a wheel install too.
[tool.hatch.build.targets.wheel.force-include]
"grammars/condition.lark" = "dsl41/grammars/condition.lark"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
# a wedged test dumps every thread's stack instead of hanging silently (the
# whole suite runs in ~30s; the v0.2.0 release hang burned a 6h CI slot mute)
faulthandler_timeout = 120

[tool.coverage.run]
# BRANCH coverage, not line: the concurrency tier is mostly decisions, and a
# guard whose false arm nothing takes is exactly the untested wiring this
# gate exists to find. Line coverage calls such a guard covered.
branch = true
source = ["src/dsl41"]

[tool.coverage.report]
# The gate is scoped, and the scope is an argument rather than a convenience.
# These are the modules that implement docs/concurrency-model.md: the state
# owner, admission, the ledger and its lock, the outbox, the routing table,
# and the engine loop that drives them. A missed branch here is a rule the
# code states and no test holds it to -- which is how `superseded_reason`
# came to be proven as a function while the wiring that acts on it was never
# once exercised (DL-105).
#
# Deliberately NOT listed: runner_supervisor.py and runner_wrapper.py run as
# separate PROCESSES, so in-process coverage reads them at ~18% however well
# tested they are (31 subprocess tests drive the supervisor); the CLI, TUI,
# viz and compiler tiers are not concurrency and get the suite's ordinary
# scrutiny, not this one.
include = [
    "src/dsl41/oracle_state.py",
    "src/dsl41/runner.py",
    # the access perimeter (DL-146) is decision-shaped the same way: an
    # authorization guard whose false arm nothing takes is an untested
    # refusal, which on this module means an untested DENIAL path
    "src/dsl41/runner_access.py",
    "src/dsl41/runner_admission.py",
    "src/dsl41/runner_effects.py",
    "src/dsl41/runner_hosts.py",
    "src/dsl41/runner_journal.py",
    "src/dsl41/runner_ledger.py",
    "src/dsl41/runner_startup.py",
]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    # a guard that fires only if this module's own invariants are already
    # broken. Every one carries a comment saying which invariant, because
    # "unreachable" is a claim and the comment is where it is made.
    "raise AssertionError",
]
