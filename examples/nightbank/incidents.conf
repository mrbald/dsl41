# nightbank default night -- scripted incidents (JOB BEHAVIOR [ARG]).
# The launcher copies this next to the run; delete lines (or use
# `nightbank up --no-incidents`) for a clean night. See RUNBOOK.md.

# EMEA custodian feed never lands: the file-watcher waits forever.
# Intervention: investigate, then `nightbank drop-file emea-custody`.
EMEA_REC_CUST_SFTP_SIM_C    no_show

# AMER FX load fails hard on its first attempt.
# Intervention: dsl41 sendevent FORCE_STARTJOB -J AMER_MKT_FX_C
AMER_MKT_FX_C               fail_once   5

# EMEA marks load hangs; term_run_time (4 min) has the engine kill it.
# Intervention: rerun after the TERMINATED (see RUNBOOK exercise 5).
EMEA_MKT_MARKS_C            hang_once

# APAC trade recon finds breaks within tolerance: exit 1, which
# max_exit_success: 1 classifies as SUCCESS. No intervention -- observe.
APAC_REC_TRADES_C           breaks      7
