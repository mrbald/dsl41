name: dsl41-workflows

services:
  postgres:
    image: docker.io/library/postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
    environment:
      POSTGRES_DB: examples
      POSTGRES_USER: example
      POSTGRES_PASSWORD: example
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U example -d examples"]
      interval: 1s
      timeout: 3s
      retries: 30
  runner:
    image: dsl41-workflow-examples:local
    build:
      context: ../..
      dockerfile: examples/workflows/Dockerfile
    environment:
      DATABASE_URL: postgresql://example:example@postgres:5432/examples
      EXAMPLE_RUNS: /runs
    volumes:
      - runs:/runs
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  database:
  runs:
